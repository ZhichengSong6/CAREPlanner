care_arm:
  # Do not configure gazebo_ros_control PID gains for these
  # VelocityJointInterface transmissions. Without pid_gains,
  # DefaultRobotHWSim keeps the joints in direct velocity mode instead of
  # wrapping the commanded velocity in an internal effort-based velocity PID.
  # CAREPlanner / JointGroupVelocityController remains the sole velocity-command
  # path, while Gazebo joint dynamics provide the simulated mechanical response.

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 100

  arm_group_velocity_controller:
    type: velocity_controllers/JointGroupVelocityController
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - wrist_joint1
      - wrist_joint2
      - wrist_joint3
