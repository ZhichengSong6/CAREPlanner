# gazebo_ros_control probes control_toolbox PID gains for every non-effort
# interface during DefaultRobotHWSim initialization. CAREPlanner intentionally
# leaves pid_gains undefined so VelocityJointInterface uses Gazebo's direct
# velocity path instead of VELOCITY_PID. Suppress only control_toolbox's
# expected "No p gain specified for pid" probe errors in the Gazebo process.
# Other ROS/Gazebo loggers keep their normal levels.
log4j.logger.ros.control_toolbox=FATAL
