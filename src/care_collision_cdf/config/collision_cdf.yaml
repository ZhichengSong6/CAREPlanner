collision_cdf:
  # Signed configuration-space distance field adapted from Yiming CDF.
  # Convention used by the GCDF-style signed training:
  #   positive = point is outside robot / collision-free side
  #   zero     = robot-point contact surface
  #   negative = point is inside robot / collision side
  # input = [workspace xyz, q1..q7].
  input_dims: 10
  output_dims: 1
  # Runtime reconstructs the exact no-skip Yiming MLP widths and NeRF flag
  # directly from checkpoint tensor shapes. These fields document the raw I/O.
  nerf: true
  signed: true
  # The signed checkpoint follows the GCDF training MLP, which uses GELU.
  # Activation has no state_dict tensors, so it cannot be inferred from weights.
  activation: "gelu"

  # "latest" selects the largest numeric iteration key for the original
  # Yiming model_dict.pt format. It also supports raw state_dict,
  # state_dict/model_state_dict wrapped checkpoints.
  checkpoint_key: "latest"

  device: "cpu"
  service_name: "/care_planner/collision_cdf/query"
  pair_service_name: "/care_planner/collision_cdf/query_pairs"

  # Guard against accidentally sending the complete dense confidence grid.
  # C5 should query only occupied + relevant low-confidence frontier points.
  max_points: 4096
  max_q: 64
  max_pairs: 8000
