trajectory_risk:
  ignored_risk_links:
    - base_link
    - link1

  # The body prior is an INITIAL trusted-free bootstrap only. It is initialized
  # once and must never be moved with the robot during trajectory-risk evaluation.
  refresh_body_prior_before_query: false
  refresh_body_prior_service: /care_planner/confidence_map/refresh_body_prior
  refresh_body_prior_timeout: 0.10

  # Legacy frontier attribution remains useful for diagnostics/visualization.
  # C4.3 reuses the same Primary/Secondary temporal-frontier semantics inside
  # trajectory_vbc below, where the final ranking is predicted VBC rather than
  # confidence gap alone.
  risk_frontier_threshold: 0.30
  primary_frontier_window_steps: 5
  risk_frontier_window_steps: 5
  safe_prefix_margin_steps: 2
  frontier_confidence_threshold: 0.50
  frontier_gap_threshold: 0.50
  frontier_radius_margin: 0.05

  # C5.2 shadow export: when enabled, trajectory_risk publishes every
  # low-confidence body-sweep sample together with the exact q_k that produced
  # it.  The collision CDF diagnostic consumes these as (p, q_k) pairs.
  forbidden_space_pair_publish_enabled: false
  forbidden_space_pair_topic: /care_planner/trajectory_risk/low_confidence_sweep_pairs
  forbidden_space_confidence_threshold: 0.50

  enable_secondary_frontier_group: true
  secondary_frontier_max_reported_samples: 200

# Visibility-before-contact (VBC) rolling target selector.
#
# For each currently low-confidence point in the selected future trajectory:
#   t_sweep = first future time when a body sample reaches that workspace cell
#   t_see   = first future time when any sensor FOV contains that point
#   margin  = t_sweep - t_see
#
# C4.3 first partitions the low-confidence swept volume temporally:
#   Primary   = earliest sweep window (imminent risk)
#   Secondary = later low-confidence swept volume (look-ahead risk)
# Primary violations have priority.  Within a group, never-visible candidates
# outrank visible candidates; otherwise smaller VBC margin wins.
trajectory_vbc:
  enabled: true

  eval_rate: 20.0
  max_eval_timesteps: 50
  query_timeout: 0.10

  # Used only if JointTrajectory.time_from_start is absent/zero.
  fallback_dt: 0.05

  # C4.2/frozen runs leave this false.  C4.3 enables it from launch: before MPC
  # predictions exist the selector automatically falls back to task_trajectory.
  prefer_predicted_trajectory: false
  predicted_trajectory_timeout: 0.20

  # Same trusted-known threshold used by the existing frontier logic.
  frontier_confidence_threshold: 0.50

  # Spatial de-duplication at confidence-map resolution.
  candidate_resolution: 0.05

  # Required lead time between first visibility and first sweep.
  min_visibility_before_sweep_margin_s: 0.30

  # Five 50-ms MPC samples, matching the original temporal-frontier window.
  primary_frontier_window_s: 0.25

  # Keep the current target when an alternative in the same frontier group is
  # only marginally more urgent.  Primary always preempts Secondary.
  target_switch_hysteresis_s: 0.05

  ignored_risk_links:
    - base_link
    - link1

  # Physical VBC prediction uses the nominal sensor model.  Learned VisCDF is
  # used only for HOW to move toward visibility.
  sensor_model:
    forward_axis: z
    tof_min_range: 0.15
    tof_max_range: 0.75
    horizontal_fov_deg: 55.0
    vertical_fov_deg: 72.0

  sensor_frames:
    - link2_sensor1_tof_link
    - link2_sensor2_tof_link
    - link3_sensor1_tof_link
    - link3_sensor2_tof_link
    - link4_sensor1_tof_link
    - link4_sensor2_tof_link
    - EE_sensor1_tof_link
    - EE_sensor2_tof_link
